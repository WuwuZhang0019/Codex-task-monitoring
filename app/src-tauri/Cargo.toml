[package]
name = "route-workbench-desktop"
version = "0.2.0"
description = "Codex task workbench desktop runtime"
edition = "2021"

[lib]
name = "route_workbench_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "=0.4.3"
dunce = "=1.0.5"
rand = "=0.8.6"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "blocking"] }
