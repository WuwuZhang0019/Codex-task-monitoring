function parsePlan(text) {
  if(!text.trim())throw new Error('请先粘贴方案，或点击“填入分叉示例”。');
  if(text.length>100000)throw new Error('方案过长。原型支持不超过 100,000 字符的小规模方案。');
  const result={name:'导入的执行方案',goal:'',steps:[]};let active=null;
  for(const line of text.split(/\r?\n/)) {
    const heading=line.match(/^\s*(?:#{1,6}\s*)?([A-Za-z]{1,8}\d{1,4}(?:[_-][A-Za-z0-9]+)?)\s*(?:[.、:：]\s*|\s+)(.+?)\s*$/);
    if(heading){active=step(heading[1],heading[2],[],{purpose:'',criteria:[],_known:false});result.steps.push(active);continue;}
    if(!active){
      const name=line.match(/^#\s+(.+)$/);if(name)result.name=name[1].trim().slice(0,80);
      const goal=line.match(/^\s*目标\s*[:：]\s*(.*)$/);if(goal)result.goal=goal[1].trim().slice(0,600);
      continue;
    }
    const dep=line.match(/^\s*(?:前置(?:步骤)?|依赖(?:步骤)?)\s*[:：]\s*(.*)$/);
    const lane=line.match(/^\s*线路\s*[:：]\s*(.*)$/);
    const criteria=line.match(/^\s*完成条件\s*[:：]\s*(.*)$/);
    const purpose=line.match(/^\s*(?:要求|说明)\s*[:：]\s*(.*)$/);
    if(dep){const value=dep[1].trim();active._known=Boolean(value);active.dependsOn=/^(?:无|无前置|无站点前置|none|起点|-|—)$/i.test(value)?[]:value.split(/[,，、;；\s]+/).filter(Boolean);}
    else if(lane)active.line=lane[1].trim().slice(0,60)||'主线';
    else if(criteria)active.criteria=criteria[1].split(/[;；]+/).map(s=>s.trim()).filter(Boolean).map(text=>({text,met:false}));
    else if(purpose)active.purpose+=(active.purpose?'\n':'')+purpose[1].trim();
    else if(line.trim())active.purpose+=(active.purpose?'\n':'')+line.trim();
  }
  if(!result.steps.length)throw new Error('没有识别到步骤。当前演示支持“## M01 步骤名称”格式，可先填入示例；任意自然语言方案需要后续接入真实模型。');
  result.steps.forEach(s=>{if(!s.criteria.length)s.criteria=[{text:'请补充并确认本站的完成条件',met:false}];});
  validateGraph(result.steps);return result;
}

      if(!criteria.length)throw new Error(`请填写 ${original.id} 至少一项完成条件。`);
      if(criteria.length>20)throw new Error(`${original.id} 的完成条件超过原型支持的 20 项，请拆分步骤。`);
      const deps=row.querySelector('.preview-deps').value.trim().split(/[,，、;；\s]+/).filter(Boolean);
      return step(original.id,row.querySelector('.preview-title').value.trim(),deps,{line:original.line,purpose:original.purpose,criteria:criteria.map(text=>({text,met:false})),next:deps.length?'前置完成后，按本站要求执行并记录结果。':'核对本站要求和完成条件后，开始执行。'});
    });
    validateGraph(steps);
    let p=projects.find(p=>p.id===importDraft.targetId && p.steps.length===0);
    if(!p){p={id:newId(),messages:[]};projects.push(p);}
    Object.assign(p,{name,goal,kind:'local',lifecycle:'active',revision:1,source:importDraft.raw,sourceTitle:importDraft.fileName||`${name}.md`,selected:steps[0].id,steps});
    closeModal();ui.search='';$('#project-search').value='';chooseProject(p.id);notify(`已生成 ${steps.length} 个站点。路线和记录仅保留在本页。`);
  }catch(e){modalError(e.message);}
}
function openSummary(text,stepId) {
  const p=current(),s=stepId?p.steps.find(s=>s.id===stepId):selected(p);
  if(!s){notify('请先生成路线并选择一个站点。');return;}
  const d=getDraft(p,s),raw=typeof text==='string'?text:d.summary;
  ui.modal={projectId:p.id,stepId:s.id};
  showModal('把总结放回对应站点',`${p.name} / ${s.id} ${s.title}`,`<div class="modal-info">这里演示“核对后写入”的交互，只保留、分段和编辑原文，不进行真实 AI 推断。确认后进入草稿，不会自动标记完成。</div><label class="field" for="summary-draft"><span class="field-label">执行总结草稿</span><textarea id="summary-draft" maxlength="10000" style="min-height:190px" placeholder="粘贴执行结果，保留已完成、剩余事项与阻塞的事实。">${esc(raw.trim().split(/\n{3,}/).join('\n\n'))}</textarea></label><label class="field" for="summary-next"><span class="field-label">下一动作</span><input type="text" id="summary-next" maxlength="600" value="${esc(d.next)}" placeholder="人工确认一个具体接续动作"></label>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="apply-summary">放入本站草稿</button>`,'summary');
}
function applySummary() {
  const text=$('#summary-draft').value.trim();if(!text){modalError('请先填写总结内容。');return;}
  const p=projects.find(p=>p.id===ui.modal.projectId),s=p?.steps.find(s=>s.id===ui.modal.stepId);
  if(!s){modalError('原站点已不存在，请关闭后重新选择站点。');return;}
  const d=getDraft(p,s);d.summary=text;d.next=$('#summary-next').value.trim();p.selected=s.id;ui.projectId=p.id;ui.tab='record';closeModal();renderAll();notify('已放入本站草稿。核对后点击“保存记录”，状态不会自动改变。');
}
function sendChat() {
  const text=$('#chat-input').value.trim();if(!text)return;
  const p=current(),s=selected(p);p.messages.push({role:'user',text});
  p.messages.push({role:'assistant',text:/\b[A-Za-z]{1,8}\d{1,4}\b/.test(text)?'可以将这段文字作为方案预览，逐项核对步骤和显式前置；也可以放入对应站点的总结草稿。当前没有调用真实模型。':'这段内容还没有写入站点。你可以选择归属，核对草稿后再保存。本原型不会生成真实模型回答，也不会推断任务已完成。',actions:true,source:text,stepId:s?.id || null});
  chatDrafts.set(p.id,'');renderChat();$('#ai-messages').scrollTop=$('#ai-messages').scrollHeight;
}
function exportPayload(p) {
  return {format:'route-workbench-prototype',version:1,exportedAt:new Date().toISOString(),project:{name:p.name,goal:p.goal,lifecycle:p.lifecycle,revision:p.revision,sourceTitle:p.sourceTitle,source:p.source,selected:p.selected,steps:clone(p.steps)}};
}
function openExport() {
  const p=current(),dirty=dirtySteps(p);
  if(dirty.length){ui.tab='record';selectStep(dirty[0].id);notify(`${dirty[0].id} 有未保存修改。请先保存或取消，再导出项目。`,true);return;}
  const text=JSON.stringify(exportPayload(p),null,2),filename=`${p.name.replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_') || 'route-project'}.json`;
  ui.modal={exportText:text,filename};
  showModal('导出项目文件','保留当前项目的方案、路线与已保存记录，下次可以重新导入。',`<div class="modal-info">当前页面不会自动写入磁盘。下载或复制 JSON 后自行留存；助手对话和未保存草稿不包含在导出中。</div><div class="source-title">${icon('file','sm')} ${esc(filename)}</div><textarea class="json-area" id="export-json" readonly aria-label="项目 JSON">${esc(text)}</textarea>`,`<button class="btn" data-action="copy-export">${icon('copy','sm')}复制 JSON</button><button class="btn primary" data-action="download-export">${icon('download','sm')}下载 JSON</button>`,'export');
}
function downloadExport() {
  const {exportText,filename}=ui.modal,blob=new Blob([exportText],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);notify('已发起文件下载。若预览阻止下载，请使用“复制 JSON”。');
}
function openRestore() {
  ui.modal={};showModal('打开项目文件','导入本原型导出的 JSON，不覆盖现有项目。',`<div class="restore-choice"><p>选择之前导出的项目文件，或粘贴 JSON。</p><button class="btn" data-action="choose-project-file">${icon('folder','sm')}选择文件</button></div><label class="field" for="restore-json"><span class="field-label">项目 JSON</span><textarea class="json-area" id="restore-json" maxlength="500000" placeholder="粘贴通过“导出项目”得到的 JSON"></textarea></label><div class="modal-info">会检查文件版本、字段类型、重复编号、未知前置和循环依赖。文件中的任何文字都只作为数据处理，不会执行。</div>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="restore-project">打开项目</button>`,'restore');
}
function readString(obj,key,max,required=false) {
  const val=obj[key];if(typeof val!=='string' || val.length>max || (required&&!val.trim()))throw new Error(`字段 ${key} 需要${required?'非空':''}文本，且不超过 ${max} 字符。`);return val;
}
function restoreProject() {
  try{
    const raw=$('#restore-json').value;if(raw.length>500000)throw new Error('项目文件超过 500 KB 的原型限制。');
    let data;try{data=JSON.parse(raw);}catch(e){throw new Error('JSON 格式不正确，请选择本原型导出的项目文件。');}
    if(!data || data.format!=='route-workbench-prototype' || data.version!==1)throw new Error('不支持这个文件格式或版本。请使用本原型导出的 version 1 项目文件。');
    const src=data.project;if(!src || typeof src!=='object' || Array.isArray(src))throw new Error('项目字段缺失或类型错误。');
    if(!Array.isArray(src.steps) || src.steps.length>30)throw new Error('站点列表无效，原型支持最多 30 站。');
    if(!['active','draft'].includes(src.lifecycle))throw new Error('项目治理状态仅支持 active 或 draft。');
    if(!Number.isInteger(src.revision) || src.revision<1)throw new Error('路线版本需要是正整数。');
    const steps=src.steps.map(s=>{
      if(!s || typeof s!=='object')throw new Error('站点需要是对象。');
      if(!['pending','active','blocked','done'].includes(s.status))throw new Error('站点状态无效。');
      if(!Array.isArray(s.dependsOn) || s.dependsOn.some(id=>typeof id!=='string'))throw new Error('前置列表需要由步骤编号组成。');
      if(!Array.isArray(s.criteria) || !s.criteria.length || s.criteria.length>20)throw new Error('每站需有 1–20 条完成条件。');
      const criteria=s.criteria.map(c=>{if(!c || typeof c.met!=='boolean')throw new Error('完成条件确认值必须为布尔值。');return {text:readString(c,'text',4000,true),met:c.met};});
      if(s.updatedAt!==null && (typeof s.updatedAt!=='string' || !Number.isFinite(Date.parse(s.updatedAt))))throw new Error('站点更新时间无效。');
      return step(readString(s,'id',32,true),readString(s,'title',100,true),s.dependsOn.slice(),{status:s.status,line:readString(s,'line',60),purpose:readString(s,'purpose',100000),summary:readString(s,'summary',10000),next:readString(s,'next',600),blocker:readString(s,'blocker',600),evidence:readString(s,'evidence',2000),criteria,updatedAt:s.updatedAt});
    });
    validateGraph(steps);let name=readString(src,'name',80,true);if(projects.some(p=>p.name===name))name=name.slice(0,72)+'（导入）';
    const p={id:newId(),name,goal:readString(src,'goal',600),lifecycle:src.lifecycle,kind:'local',revision:src.revision,sourceTitle:readString(src,'sourceTitle',160),source:readString(src,'source',100000),selected:steps.some(s=>s.id===src.selected)?src.selected:steps[0]?.id || null,steps,messages:[]};
    projects.push(p);closeModal();ui.search='';$('#project-search').value='';chooseProject(p.id);notify('项目文件已打开，路线和已保存记录已恢复到本页。');
  }catch(e){modalError(e.message);}
}

function setDrawerState() {
  const navOverlay=ui.navOpen && window.innerWidth<=680,aiOverlay=ui.aiOpen && window.innerWidth<1240 && !navOverlay;
  $('.workspace').inert=navOverlay || aiOverlay;
  $('.sidebar').inert=aiOverlay;
  $('.ai-panel').inert=navOverlay;
  for(const [el,active] of [[$('.sidebar'),navOverlay],[$('.ai-panel'),aiOverlay]]){
    el.setAttribute('role',active?'dialog':'complementary');
    if(active)el.setAttribute('aria-modal','true');else el.removeAttribute('aria-modal');
  }
}
function refreshChrome() {updateChrome();setDrawerState();requestAnimationFrame(renderMap);}
document.addEventListener('click',event=>{
  const target=event.target.closest('button');if(!target || target.disabled)return;
  if(target.dataset.project){chooseProject(target.dataset.project);setDrawerState();return;}
  if(target.dataset.step){const wasStation=target.classList.contains('station');selectStep(target.dataset.step);if(wasStation)$$('.station').find(b=>b.dataset.step===target.dataset.step)?.focus({preventScroll:true});return;}
  if(target.dataset.tab){ui.tab=target.dataset.tab;renderDetail();$(`#tab-${ui.tab}`).focus({preventScroll:true});return;}
  const action=target.dataset.action;if(!action)return;
  switch(action){
    case 'toggle-ai':ui.aiOpen=!ui.aiOpen;ui.navOpen=false;refreshChrome();if(ui.aiOpen && window.innerWidth<1240)requestAnimationFrame(()=>$('.ai-heading .icon-button').focus());else if(!ui.aiOpen)requestAnimationFrame(()=>$('.ai-toggle').focus({preventScroll:true}));break;
    case 'toggle-nav':ui.navOpen=!ui.navOpen;refreshChrome();if(ui.navOpen)requestAnimationFrame(()=>$('.sidebar-close').focus());else requestAnimationFrame(()=>$('.mobile-menu').focus({preventScroll:true}));break;
    case 'new-project':openNewProject();break;
    case 'create-project':createProject();break;
    case 'source':openSource();break;
    case 'copy-source':copyText(current().source,'方案文本');break;
    case 'about':openAbout();break;
    case 'close-modal':closeModal();break;
    case 'locate-current':{
      const p=current(),a=analyse(p);const s=p.steps.find(s=>s.status==='active')||p.steps.find(s=>a.display.get(s.id).code==='ready')||selected(p);if(s){selectStep(s.id,true);$$('.station').find(b=>b.dataset.step===s.id)?.focus({preventScroll:true});}break;
    }
    case 'save-record':saveRecord();break;
    case 'discard-draft':{const p=current(),s=selected(p);if(s){drafts.delete(draftKey(p,s));renderDetail();notify('已取消本站的未保存修改。');}break;}
    case 'continuation':{const p=current(),s=selected(p);if(s)copyText(continuationText(p,s),'接续摘要');break;}
    case 'task-prompt':openTaskPrompt();break;
    case 'copy-task-prompt':copyText($('#task-prompt-text').value,'任务指令');break;
    case 'import-plan':openImport();break;
    case 'import-sample':openImport(SAMPLE_PLAN);break;
    case 'fill-sample':$('#plan-input').value=SAMPLE_PLAN;importDraft.raw=SAMPLE_PLAN;$('#plan-input').focus();break;
    case 'choose-plan-file':$('#plan-file').value='';$('#plan-file').click();break;
    case 'parse-plan':previewPlan();break;
    case 'back-to-plan':importDraft.name=$('#preview-project-name').value;importDraft.goal=$('#preview-goal').value;showImportForm();break;
    case 'confirm-route':confirmRoute();break;
    case 'summary':openSummary();break;
    case 'apply-summary':applySummary();break;
    case 'message-plan':{const m=current().messages[Number(target.dataset.message)];if(m)openImport(m.source);break;}
    case 'message-summary':{const m=current().messages[Number(target.dataset.message)];if(m)openSummary(m.source,m.stepId);break;}
    case 'export':openExport();break;
    case 'copy-export':copyText($('#export-json').value,'项目 JSON');break;
    case 'download-export':downloadExport();break;
    case 'restore':openRestore();break;
    case 'choose-project-file':$('#project-file').value='';$('#project-file').click();break;
    case 'restore-project':restoreProject();break;
    case 'select-copy':$('#manual-copy').focus();$('#manual-copy').select();break;
  }
});
document.addEventListener('input',event=>{
  const el=event.target;
  if(el.id==='project-search'){ui.search=el.value;renderSidebar();return;}
  if(el.id==='chat-input'){chatDrafts.set(current().id,el.value);$('#send-button').disabled=!el.value.trim();return;}
  if(el.dataset.field && el.closest('#detail-panel')){
    const p=current(),s=selected(p);if(!s)return;const d=getDraft(p,s);
    if(['status','summary','next','blocker','evidence'].includes(el.dataset.field))d[el.dataset.field]=el.value;
    if(el.dataset.field==='status' && $('#blocker-field'))$('#blocker-field').hidden=d.status!=='blocked';
    if($('#record-error'))$('#record-error').hidden=true;updateDirtyIndicators();return;
  }
  if(el.hasAttribute('data-criterion')){
    const p=current(),s=selected(p);if(s){getDraft(p,s).criteria[Number(el.dataset.criterion)].met=el.checked;updateDirtyIndicators();if($('#record-error'))$('#record-error').hidden=true;}return;
  }
  if(el.classList.contains('preview-deps')){const row=el.closest('.preview-row');row.querySelector('.preview-confirmed').checked=false;row.querySelector('.preview-confirm').classList.add('needs-confirm');}
  if(el.classList.contains('preview-confirmed'))el.closest('.preview-confirm').classList.toggle('needs-confirm',!el.checked);
});
$('#chat-form').addEventListener('submit',e=>{e.preventDefault();sendChat();});
$('#chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendChat();}});
$('#dialog').addEventListener('cancel',()=>{ui.modal=null;});
$('#dialog').addEventListener('click',e=>{if(e.target!==$('#dialog'))return;const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#dialog').open){if(ui.navOpen){ui.navOpen=false;refreshChrome();$('.mobile-menu').focus();}else if(ui.aiOpen&&window.innerWidth<1240){ui.aiOpen=false;refreshChrome();$('.ai-toggle').focus();}}
  if(e.key==='Enter' && ui.modal?.kind==='new-project' && e.target.id==='new-name'){e.preventDefault();createProject();return;}
  if(e.target.matches('.detail-tab')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
    e.preventDefault();const tabs=['record','requirements','session'],i=tabs.indexOf(ui.tab);ui.tab=e.key==='Home'?tabs[0]:e.key==='End'?tabs[2]:tabs[(i+(e.key==='ArrowRight'?1:2))%3];renderDetail();$(`#tab-${ui.tab}`).focus();return;
  }
  if(e.target.matches('.station')&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key)){
    e.preventDefault();const buttons=$$('.station'),origin=e.target,x=parseFloat(origin.style.left),y=parseFloat(origin.style.top);let destination;
    if(e.key==='Home')destination=buttons[0];else if(e.key==='End')destination=buttons[buttons.length-1];
    else {
      const horizontal=['ArrowLeft','ArrowRight'].includes(e.key),sign=['ArrowRight','ArrowDown'].includes(e.key)?1:-1;
      destination=buttons.filter(b=>b!==origin).map(b=>({el:b,dx:parseFloat(b.style.left)-x,dy:parseFloat(b.style.top)-y})).filter(o=>(horizontal?o.dx:o.dy)*sign>1).sort((a,b)=>((horizontal?Math.abs(a.dx)*2+Math.abs(a.dy):Math.abs(a.dy)*2+Math.abs(a.dx))-(horizontal?Math.abs(b.dx)*2+Math.abs(b.dy):Math.abs(b.dy)*2+Math.abs(b.dx))))[0]?.el;
    }
    if(destination){const id=destination.dataset.step;selectStep(id,true);$$('.station').find(b=>b.dataset.step===id)?.focus({preventScroll:true});}return;
  }
  if(e.key==='Tab'&&!$('#dialog').open){
    const drawer=ui.navOpen&&window.innerWidth<=680?$('.sidebar'):ui.aiOpen&&window.innerWidth<1240?$('.ai-panel'):null;
    if(drawer){const items=Array.from(drawer.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),a[href]')).filter(el=>el.getClientRects().length);const first=items[0],last=items[items.length-1];if(e.shiftKey&&(document.activeElement===first||!drawer.contains(document.activeElement))){e.preventDefault();last?.focus();}else if(!e.shiftKey&&(document.activeElement===last||!drawer.contains(document.activeElement))){e.preventDefault();first?.focus();}}
  }
});
$('#plan-file').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;const thisDraft=importDraft;

$('#project-file').addEventListener('change',async e=>{
