<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>U01 固定宿主探测</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font: 14px system-ui;
  color: white;
}
#shape {
  position: absolute;
  inset: 0;
  background: #111;
  clip-path: inset(0 160px 522px);
  border-radius: 0;
}
#anchor {
  position: absolute;
  left: 160px;
  top: 0;
  width: 600px;
  height: 38px;
  text-align: center;
  line-height: 38px;
  white-space: nowrap;
}
#body { position: absolute; left: 30px; right: 30px; top: 65px; }
button { padding: 12px; }
</style>
<div id="shape"><div id="body">U01 · 固定 920×560 DIP 宿主 · 2026-11-09<br><br>
<p>仅用于原生可行性测量。20 次开合后停在紧凑态。</p></div></div>
<div id="anchor">U01 · 原生探测　①──②──③──④──⑤──⑥──⑦──⑧</div>
<button id="hit" style="position:absolute;left:700px;top:4px;padding:2px;height:30px">测试</button>
<script>
const invoke = window.__TAURI__.core.invoke;
let frame = 0;
const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
let controlQueue = Promise.resolve();
let currentProgress = 0;
window.probeControl = (progress, animated) => {
  controlQueue = controlQueue.then(async () => {
    if (animated) {
      await wait(3000);
      for (let cycle = 0; cycle < 20; cycle++) {
        await animate(currentProgress, 1);
        await animate(1, 0);
      }
    } else {
      await apply(progress);
    }
  }).catch(error => { document.querySelector('#anchor').textContent = String(error); });
};
async function apply(progress) {
  const response = await invoke('probe_frame', { frame: ++frame, progress });
  document.querySelector('#shape').style.clipPath =
    `inset(0 ${160 * (1 - progress)}px ${522 * (1 - progress)}px)`;
  await new Promise(requestAnimationFrame);
  const rect = document.querySelector('#anchor').getBoundingClientRect();
  await invoke('probe_input', {
    kind: 'measurement',
    value: JSON.stringify({
      frame, progress,
      anchor: { x: rect.x, y: rect.y, width: rect.width, height: rect.height },
      foreground: response.foreground,
    }),
  });
  currentProgress = progress;
}
async function animate(from, to) {
  for (let index = 0; index <= 16; index++) {
    await apply(from + (to - from) * index / 16);
    await wait(16);
  }
}
document.querySelector('#hit').onclick = () => invoke('probe_input', {
  kind: 'click', value: 'panel-button',
});
async function runProbe() {
  await apply(0);
  // Native show is deferred until the compact region exists.
  await invoke('probe_input', { kind: 'ready', value: 'compact-region-ready' });
  await invoke('probe_input', { kind: 'complete', value: 'manual-controls-ready' });
}
runProbe().catch(error => {
  document.querySelector('#anchor').textContent = String(error);
});
</script></html>
